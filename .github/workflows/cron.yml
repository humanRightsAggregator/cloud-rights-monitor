name: Global Human Rights Monitor Scheduler

on:
  schedule:
    # 1. Ingestion Runs (Every 6 Hours)
    - cron: '0 */6 * * *'

    # 2. Slot 1 Peak Publication: 6:00 PM IST (12:30 PM UTC)
    - cron: '30 12 * * *'

    # 3. Slot 2 Peak Publication: 10:30 PM IST (5:00 PM UTC)
    - cron: '0 17 * * *'

  workflow_dispatch:

jobs:
  run-monitor-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingestion Task
        run: |
          curl -s -X GET "https://cloud-rights-monitor.onrender.com/ingest-feeds"

      - name: Trigger Peak Publishing Task (Slot Windows Only)
        if: github.event.schedule == '30 12 * * *' || github.event.schedule == '0 17 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X GET "https://cloud-rights-monitor.onrender.com/publish-queue"
